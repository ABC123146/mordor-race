name: merge-auto-logs
on:
  push:
    paths: ['logs/auto/**']
jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/merge_auto.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A logs
          git diff --cached --quiet || git commit -m "merge auto logs"
          git push
